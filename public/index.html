<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>FPS Mobile</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
:root{--bg:#0d100a;--ol:#4b5a2a;--ol2:#6f8438;--sand:#d5d3bd;--line:#ffffff26;--red:#e03030;--blue:#3a70f0}
html,body{margin:0;height:100%;overflow:hidden;background:#0d100a;font-family:"Arial Narrow","Roboto Condensed",system-ui,sans-serif;color:#fff}
canvas{display:block}
button,select,input{font-family:inherit}
/* ---- menu inicial ---- */
#menu{position:fixed;inset:0;z-index:9;overflow:auto;touch-action:pan-y;background:linear-gradient(rgba(8,10,6,.82),rgba(8,10,6,.92)),repeating-linear-gradient(45deg,#1b2112 0 14px,#151a0e 14px 28px);display:flex;justify-content:center;padding:14px}
#menu .panel{width:min(380px,100%);margin:auto;display:flex;flex-direction:column;gap:9px}
#menu h1{margin:0;font-size:34px;letter-spacing:5px;color:var(--sand);text-shadow:0 2px 0 #000;border-left:6px solid var(--ol2);padding-left:10px;line-height:1}
#menu .sub{font-size:12px;letter-spacing:3px;color:#9aa57a;margin:-4px 0 4px 16px}
.lbl{font-size:11px;letter-spacing:2px;color:#9aa57a;margin-top:2px}
#menu input,#menu select,.cfgrow select{width:100%;padding:11px;font-size:16px;border-radius:3px;border:1px solid var(--line);background:#1c2214;color:#fff;touch-action:manipulation}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
#menu button,#cfg button,#pause button{padding:12px;font-size:16px;font-weight:700;letter-spacing:2px;border-radius:3px;border:1px solid var(--line);background:#2a3320;color:var(--sand);touch-action:manipulation}
#menu button.go{background:linear-gradient(#6f8438,#4b5a2a);color:#fff;font-size:20px;padding:15px;border-color:#9bb25a}
#maps{display:flex;flex-direction:column;gap:6px}
.mapc{text-align:left;display:flex;flex-direction:column;gap:2px;letter-spacing:1px!important}
.mapc span{font-size:12px;font-weight:400;letter-spacing:0;color:#aab38c}
.mapc.on{background:#3c4a22!important;border-color:#9bb25a!important;box-shadow:inset 4px 0 0 #9bb25a}
#msg{color:#ff9d9d;min-height:18px;font-size:13px}
/* ---- configurações ---- */
#cfg{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:#05070aee;padding:16px;touch-action:pan-y;overflow:auto}
#cfg .panel{width:min(360px,100%);display:flex;flex-direction:column;gap:10px;background:#141a0e;border:1px solid var(--line);border-left:5px solid var(--ol2);padding:16px}
#cfg h2,#pause h2{margin:0;font-size:22px;letter-spacing:3px;color:var(--sand)}
.cfgrow{display:flex;flex-direction:column;gap:4px}.cfgrow label{font-size:11px;letter-spacing:2px;color:#9aa57a}
.cfgrow input[type=range]{width:100%;touch-action:manipulation}
/* ---- HUD ---- */
.hud{position:fixed;pointer-events:none;z-index:5}
#hp{left:12px;top:10px;width:150px}
#hpbar{height:10px;background:#0009;border:1px solid #fff5}#hpfill{display:block;height:100%;width:100%;background:#7bd34a;transition:width .15s}
#hpn{font-size:20px;font-weight:700;text-shadow:0 1px 3px #000}
#team{left:12px;top:56px;font-size:11px;letter-spacing:2px;font-weight:700;padding:3px 8px;background:#0008;border-left:4px solid #fff}
#ammo{right:14px;bottom:12px;text-align:right;text-shadow:0 1px 3px #000}
#am1{font-size:34px}#am2{font-size:18px;opacity:.8}#wname{font-size:11px;letter-spacing:2px;color:#cfd6b8}
#cross{left:50%;top:50%;width:26px;height:26px;margin:-13px}
#cross i{position:absolute;background:#fffd;box-shadow:0 0 2px #000}
#cross i:nth-child(1){left:12px;top:0;width:2px;height:8px}#cross i:nth-child(2){left:12px;bottom:0;width:2px;height:8px}
#cross i:nth-child(3){top:12px;left:0;height:2px;width:8px}#cross i:nth-child(4){top:12px;right:0;height:2px;width:8px}
#cross.hit i{background:#ff3b3b}
#board{right:10px;top:8px;font-size:12px;background:#0008;padding:6px 8px;border-left:3px solid var(--ol2);min-width:140px}
#feed{left:12px;top:92px;font-size:12px;text-shadow:0 1px 2px #000}
#info{left:50%;top:6px;transform:translateX(-50%);font-size:12px;background:#0008;padding:3px 8px;white-space:nowrap}
#red{inset:0;background:radial-gradient(ellipse at center,rgba(255,0,0,0) 35%,rgba(200,0,0,.9) 100%);opacity:0;transition:opacity .25s}
#dmgdir{left:50%;top:50%;width:200px;height:200px;margin:-100px;opacity:0;transition:opacity .4s}
#dmgdir i{position:absolute;left:70px;top:0;width:60px;height:26px;background:#f22;clip-path:polygon(50% 0,100% 100%,0 100%);filter:drop-shadow(0 0 4px #000)}
#dead{inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#300a;font-size:34px;letter-spacing:6px;font-weight:700}
#dead small{font-size:15px;letter-spacing:2px;margin-top:6px}
#fps{left:12px;bottom:8px;font-size:11px;color:#9f9;display:none}
#joy{position:fixed;left:24px;bottom:24px;width:130px;height:130px;border-radius:50%;background:#fff2;border:2px solid #fff4;z-index:6}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:#fff7}
.btn{position:fixed;z-index:6;border-radius:50%;background:#4b5a2aaa;border:2px solid #fff6;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;letter-spacing:1px}
#bFire{right:24px;bottom:70px;width:84px;height:84px;background:#c0392baa}
#bJump{right:120px;bottom:30px;width:60px;height:60px;background:#2f6bffaa}
#bRel{right:120px;bottom:100px;width:60px;height:60px;background:#3a3a3aaa}
#bCrouch{right:34px;bottom:164px;width:54px;height:54px;background:#6b4a2aaa}#bCrouch.on{background:#d98a2fdd}
#bZoom{display:none;right:192px;bottom:62px;width:56px;height:56px;background:#8a4bffaa}
#scope{display:none;z-index:4;inset:0;background:linear-gradient(#000,#000) center/100% 1px no-repeat,linear-gradient(#000,#000) center/1px 100% no-repeat,radial-gradient(circle at center,#0000 0,#0000 38vmin,#000 38.5vmin)}
#pbtn{position:fixed;left:50%;top:32px;transform:translateX(-50%);z-index:7;background:#0008;border:1px solid #fff4;padding:5px 14px;font-size:13px;font-weight:700;letter-spacing:2px}
#pause{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;background:#0a0e06ee}
#psala{font-size:14px;opacity:.8;margin-bottom:6px}
#pause button{width:min(320px,100%)}#pause button.out{background:#7a2a2a}
#pause small{opacity:.6;font-size:12px;text-align:center}
#wpns{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:5px;z-index:6}
.wbtn{width:42px;height:40px;background:#0009;border:2px solid #fff4;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:700;line-height:1.15}
.wbtn b{font-size:14px}.wbtn.on{background:#6f8438dd;border-color:#fff}
@media (max-width:640px){.wbtn{width:34px}#wpns{gap:4px}}
@media (orientation:portrait){#wpns{bottom:172px}#bZoom{right:24px;bottom:172px}#bCrouch{right:100px;bottom:172px}}
</style></head><body>
<div id="menu"><div class="panel">
  <h1>FPS MOBILE</h1><div class="sub">OPERAÇÃO CAMPO ABERTO</div>
  <input id="name" maxlength="14" placeholder="Seu nome">
  <div class="lbl">MAPA</div>
  <div id="maps">
    <button class="mapc on" data-m="base"><b>BASE MILITAR</b><span>Quartéis, barricadas, contêineres e torres</span></button>
    <button class="mapc" data-m="industrial"><b>COMPLEXO INDUSTRIAL</b><span>Galpões, tubulações e corredores estreitos</span></button>
    <button class="mapc" data-m="desert"><b>DESERTO MILITAR</b><span>Dunas, posto avançado e veículos abandonados</span></button>
  </div>
  <div class="row"><select id="mode"><option value="ffa">Cada um por si</option><option value="team">Equipes (vermelho x azul)</option></select><select id="max"><option>2</option><option>4</option><option selected>6</option><option>8</option></select></div>
  <div class="lbl">ARMA INICIAL</div><select id="wsel"></select>
  <button id="bCreate" class="go">JOGAR</button>
  <div class="row"><input id="code" maxlength="5" placeholder="Código da sala" style="text-transform:uppercase"><button id="bJoin">ENTRAR</button></div>
  <button id="bCfg">CONFIGURAÇÕES</button>
  <div id="msg"></div>
</div></div>
<div id="cfg"><div class="panel">
  <h2>CONFIGURAÇÕES</h2>
  <div class="cfgrow"><label>GRÁFICOS</label><select id="cGfx"><option value="low">Baixo (mais rápido)</option><option value="med">Médio</option><option value="high">Alto (sombras melhores)</option></select></div>
  <div class="cfgrow"><label>SOM</label><select id="cSnd"><option value="1">Ligado</option><option value="0">Desligado</option></select></div>
  <div class="cfgrow"><label>SENSIBILIDADE DA CÂMERA</label><input id="cSens" type="range" min="0.4" max="2" step="0.1"></div>
  <div class="cfgrow"><label>CONTADOR DE FPS</label><select id="cFps"><option value="0">Oculto</option><option value="1">Visível</option></select></div>
  <button id="bCfgOk">FECHAR</button>
</div></div>
<div class="hud" id="hp"><div id="hpbar"><i id="hpfill"></i></div><span id="hpn">100</span></div>
<div class="hud" id="team"></div>
<div class="hud" id="ammo"><span id="am1"></span><span id="am2"></span><div id="wname"></div></div>
<div class="hud" id="cross"><i></i><i></i><i></i><i></i></div>
<div class="hud" id="board"></div><div class="hud" id="feed"></div><div class="hud" id="info"></div><div class="hud" id="red"></div>
<div class="hud" id="dmgdir"><i></i></div><div class="hud" id="dead">ELIMINADO<small id="dsec"></small></div><div class="hud" id="fps"></div>
<div id="joy"><div id="knob"></div></div>
<div class="btn" id="bFire">ATIRAR</div><div class="btn" id="bJump">PULAR</div><div class="btn" id="bRel">RECARR.</div><div class="btn" id="bCrouch">AGACHAR</div>
<div class="hud" id="scope"></div>
<div class="btn ui" id="bZoom">MIRA</div>
<div class="ui" id="wpns"></div>
<div class="ui" id="pbtn">☰ MENU</div>
<div class="ui" id="pause">
  <h2>PAUSADO</h2><div id="psala"></div>
  <button id="bResume">CONTINUAR</button><button id="bCfg2">CONFIGURAÇÕES</button><button id="bLeave" class="out">SAIR DA PARTIDA</button>
  <small>A partida continua para os outros jogadores.</small>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[(Math.random() * a.length) | 0], lerp = (a, b, k) => a + (b - a) * Math.min(1, k);
const sock = io();

// ---------- Configurações (salvas no aparelho) ----------
const CFG = { gfx: (navigator.hardwareConcurrency || 4) <= 4 ? 'low' : 'med', snd: 1, sens: 1, fps: 0 };
try { Object.assign(CFG, JSON.parse(localStorage.fpsCfg || '{}')); } catch (e) { }
const saveCfg = () => { try { localStorage.fpsCfg = JSON.stringify(CFG); } catch (e) { } };
$('name').value = localStorage.nome || '';
const qs = new URLSearchParams(location.search); if (qs.get('sala')) $('code').value = qs.get('sala');

// ---------- Estado ----------
let inRoom = false, roomCode = '', myId = '', boxes = [], myTeam = -1, mode = 'ffa', LIM = 60, mapId = 'base';
let hp = 100, dead = false, deadAt = 0, ammo = 12, reloading = false, reloadStart = 0, lastShot = 0;
const P = { x: 0, y: 0, z: 0, vy: 0, yaw: 0, pitch: 0 };
let jx = 0, jy = 0, firing = false, paused = false, cur = 0, zoomed = false, reloadT = 0, crouch = false, eyeH = 1.6, camY = 0, kick = 0, swapT = 0, moving = false, runF = 0;
let selMap = 'base';

// ---------- Texturas procedurais (sem arquivos externos; criadas só quando o mapa precisa) ----------
const TEXREG = [], TXC = {};
function makeTex(size, draw, aniso) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d'); draw(x, size);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = aniso || 4;
  t.userData = { full: c, size, small: null }; TEXREG.push(t); return t;
}
let texLow = false;
function setTexQuality(low) {   // BAIXO usa texturas com metade da resolução
  texLow = low;
  for (const t of TEXREG) {
    const u = t.userData; if (u.size < 64) continue;
    if (low) { if (!u.small) { const s = document.createElement('canvas'); s.width = s.height = u.size >> 1; s.getContext('2d').drawImage(u.full, 0, 0, s.width, s.height); u.small = s; } t.image = u.small; } else t.image = u.full;
    t.needsUpdate = true;
  }
}
function wrapDraw(s, x, y, m, fn) { fn(x, y); if (x < m) fn(x + s, y); if (x > s - m) fn(x - s, y); if (y < m) fn(x, y + s); if (y > s - m) fn(x, y - s); }
function blots(x, s, n, r0, r1, rgb, a) { for (let i = 0; i < n; i++) { const r = rnd(r0, r1); wrapDraw(s, rnd(0, s), rnd(0, s), r, (px, py) => { const g = x.createRadialGradient(px, py, 0, px, py, r); g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`); x.fillStyle = g; x.fillRect(px - r, py - r, r * 2, r * 2); }); } }
function specks(x, s, n, lo, hi, a0, a1, sz) { for (let i = 0; i < n; i++) { const v = rnd(lo, hi) | 0; x.fillStyle = `rgba(${v},${v},${v - 3},${rnd(a0, a1)})`; x.fillRect(rnd(0, s), rnd(0, s), rnd(1, sz), rnd(1, sz)); } }
function streaks(x, s, n, rgb, a) { for (let i = 0; i < n; i++) { const xx = rnd(0, s), h = rnd(50, 150), g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`); x.fillStyle = g; x.fillRect(xx, 0, rnd(4, 14), h); } }
function bolts(x, s, rows, col) { x.fillStyle = col; for (const yy of rows) for (let xx = 8; xx < s; xx += 32) { x.beginPath(); x.arc(xx, yy, 2, 0, 7); x.fill(); } }
const TXD = {
  grass: [512, (x, s) => { x.fillStyle = '#4b7a41'; x.fillRect(0, 0, s, s); blots(x, s, 50, 30, 90, '130,180,90', .16); blots(x, s, 50, 30, 90, '20,50,20', .16); blots(x, s, 6, 25, 55, '125,104,70', .45);
    const cols = ['#3f6d38', '#5a8f4a', '#6aa357', '#35602f', '#7fb35f']; for (let i = 0; i < 3000; i++) { const px = rnd(0, s), py = rnd(0, s), dx = rnd(-2, 2), dy = rnd(3, 8), c = pick(cols); wrapDraw(s, px, py, 10, (a, b) => { x.strokeStyle = c; x.beginPath(); x.moveTo(a, b); x.lineTo(a + dx, b - dy); x.stroke(); }); } }, 6],
  sand: [512, (x, s) => { x.fillStyle = '#caa86c'; x.fillRect(0, 0, s, s); blots(x, s, 40, 30, 90, '240,212,150', .22); blots(x, s, 40, 30, 90, '150,115,60', .2);
    for (let i = 0; i < 30; i++) { x.strokeStyle = Math.random() < .5 ? 'rgba(255,235,180,.16)' : 'rgba(120,85,40,.14)'; x.lineWidth = rnd(1, 3); const yy = rnd(0, s); x.beginPath(); x.moveTo(0, yy); x.bezierCurveTo(s * .3, yy + rnd(-12, 12), s * .6, yy + rnd(-12, 12), s, yy); x.stroke(); }
    specks(x, s, 2500, 150, 230, .1, .3, 2.2); }, 6],
  asph: [256, (x, s) => { x.fillStyle = '#3c3d41'; x.fillRect(0, 0, s, s); specks(x, s, 2500, 40, 100, .15, .4, 2.5); blots(x, s, 8, 20, 50, '0,0,0', .3);
    x.strokeStyle = 'rgba(0,0,0,.6)'; x.lineWidth = 1.5; for (let i = 0; i < 4; i++) { let u = rnd(0, s), v = rnd(0, s); x.beginPath(); x.moveTo(u, v); for (let k = 0; k < 6; k++) { u += rnd(8, 26); v += rnd(-10, 10); x.lineTo(u, v); } x.stroke(); } }, 4],
  conc: [256, (x, s) => { x.fillStyle = '#8d8a84'; x.fillRect(0, 0, s, s); specks(x, s, 2200, 90, 190, .12, .35, 2.5); streaks(x, s, 9, '0,0,0', .2);
    x.strokeStyle = 'rgba(0,0,0,.45)'; x.lineWidth = 4; for (const v of [0, s / 2, s]) { x.beginPath(); x.moveTo(0, v); x.lineTo(s, v); x.stroke(); x.beginPath(); x.moveTo(v, 0); x.lineTo(v, s); x.stroke(); }
    x.strokeStyle = 'rgba(255,255,255,.12)'; x.lineWidth = 2; for (const v of [3, s / 2 + 3]) { x.beginPath(); x.moveTo(0, v); x.lineTo(s, v); x.stroke(); x.beginPath(); x.moveTo(v, 0); x.lineTo(v, s); x.stroke(); }
    x.fillStyle = 'rgba(40,40,40,.6)'; for (const a of [14, s / 2 - 14, s / 2 + 14, s - 14]) for (const b of [14, s / 2 - 14, s / 2 + 14, s - 14]) { x.beginPath(); x.arc(a, b, 2.5, 0, 7); x.fill(); } }, 8],
  stucco: [256, (x, s) => { x.fillStyle = '#d4c9b0'; x.fillRect(0, 0, s, s); specks(x, s, 1800, 150, 215, .1, .3, 3);
    for (let i = 0; i < 4; i++) { const px = rnd(10, s - 70), py = rnd(10, s - 60), pw = rnd(30, 60), ph = rnd(25, 50); x.fillStyle = '#8a5a46'; x.fillRect(px, py, pw, ph); x.strokeStyle = '#a89f92'; x.lineWidth = 2;
      for (let yy = py; yy < py + ph; yy += 10) { x.beginPath(); x.moveTo(px, yy); x.lineTo(px + pw, yy); x.stroke(); for (let xx = px + ((yy / 10 | 0) % 2 ? 8 : 0); xx < px + pw; xx += 16) { x.beginPath(); x.moveTo(xx, yy); x.lineTo(xx, yy + 10); x.stroke(); } } }
    streaks(x, s, 8, '40,30,20', .25); x.strokeStyle = 'rgba(40,30,25,.5)'; x.lineWidth = 1.2; for (let i = 0; i < 4; i++) { let cx = rnd(0, s), cy = rnd(0, s); x.beginPath(); x.moveTo(cx, cy); for (let k = 0; k < 6; k++) { cx += rnd(-12, 12); cy += rnd(6, 18); x.lineTo(cx, cy); } x.stroke(); } }, 8],
  brick: [256, (x, s) => { x.fillStyle = '#9a9488'; x.fillRect(0, 0, s, s);
    for (let r = 0; r < s / 16; r++) for (let c = -1; c < s / 32 + 1; c++) { x.fillStyle = Math.random() < .04 ? '#2a2420' : pick(['#8b4a3b', '#7d4033', '#94513f', '#703a2e', '#9a5a45']); x.fillRect(c * 32 + (r % 2 ? 16 : 0) + 1, r * 16 + 1, 30, 14); }
    streaks(x, s, 12, '0,0,0', .4); blots(x, s, 10, 8, 22, '70,100,50', .35); }, 8],
  tin: [256, (x, s) => { for (let i = 0; i < s; i += 8) { x.fillStyle = '#a39683'; x.fillRect(i, 0, 4, s); x.fillStyle = '#7a6e60'; x.fillRect(i + 4, 0, 4, s); }
    blots(x, s, 36, 10, 40, '140,70,30', .45); for (let i = 0; i < 20; i++) { x.strokeStyle = `rgba(90,45,20,${rnd(.15, .35)})`; x.lineWidth = rnd(1, 3); const xx = rnd(0, s); x.beginPath(); x.moveTo(xx, rnd(0, s * .4)); x.lineTo(xx + rnd(-3, 3), rnd(s * .5, s)); x.stroke(); } bolts(x, s, [10, s - 10], 'rgba(40,40,40,.55)'); }, 4],
  mil: [256, (x, s) => { x.fillStyle = '#b9bcac'; x.fillRect(0, 0, s, s); specks(x, s, 1200, 120, 210, .1, .3, 2); blots(x, s, 14, 10, 40, '70,60,40', .25);
    x.strokeStyle = 'rgba(0,0,0,.45)'; x.lineWidth = 3; for (const v of [0, s / 2, s]) { x.beginPath(); x.moveTo(0, v); x.lineTo(s, v); x.stroke(); x.beginPath(); x.moveTo(v, 0); x.lineTo(v, s); x.stroke(); }
    bolts(x, s, [10, s / 2 - 10, s / 2 + 10, s - 10], 'rgba(30,30,30,.6)'); x.fillStyle = 'rgba(240,240,225,.55)'; x.fillRect(150, 40, 70, 16); x.fillStyle = 'rgba(20,25,15,.8)'; x.font = 'bold 13px monospace'; x.fillText('MIL-07', 158, 53);

// ---------- Rede ----------

// ---------- Armas, mira, pausa e configurações ----------
