<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>FPS Mobile</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:system-ui,sans-serif;color:#fff}
canvas{display:block}
#menu{position:fixed;inset:0;background:#10151f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;z-index:9;overflow:auto}
#menu h1{margin:0 0 6px;font-size:28px;color:#ff7a2f}
#menu input,#menu select,#menu button{width:min(320px,100%);padding:12px;font-size:16px;border-radius:10px;border:0}
#menu input,#menu select{background:#222c3d;color:#fff}
#menu button{background:#ff7a2f;color:#fff;font-weight:700}
#menu button.alt{background:#2f6bff}
#msg{color:#ffb4b4;min-height:20px;font-size:14px}
.hud{position:fixed;pointer-events:none;z-index:5}
#hp{left:12px;top:10px;font-size:18px;font-weight:700;text-shadow:0 1px 3px #000}
#ammo{right:12px;bottom:12px;font-size:20px;font-weight:700}
#cross{left:50%;top:50%;width:14px;height:14px;margin:-7px;border:2px solid #fff8;border-radius:50%}
#board{right:10px;top:8px;font-size:12px;background:#0007;padding:6px 8px;border-radius:8px;min-width:130px}
#feed{left:12px;top:40px;font-size:12px;text-shadow:0 1px 2px #000}
#info{left:50%;top:6px;transform:translateX(-50%);font-size:12px;background:#0007;padding:3px 8px;border-radius:8px}
#red{inset:0;background:#f00;opacity:0;transition:opacity .25s}
#joy{position:fixed;left:24px;bottom:24px;width:130px;height:130px;border-radius:50%;background:#fff2;border:2px solid #fff4;z-index:6}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:#fff7}
.btn{position:fixed;z-index:6;border-radius:50%;background:#ff3b3b99;border:2px solid #fff6;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
#bFire{right:24px;bottom:70px;width:84px;height:84px}
#bJump{right:120px;bottom:30px;width:60px;height:60px;background:#2f6bff99}
#bRel{right:120px;bottom:100px;width:60px;height:60px;background:#3a3a3a99}
/* menu de pausa / sair da partida */
#pbtn{position:fixed;left:50%;top:32px;transform:translateX(-50%);z-index:7;background:#0007;border:1px solid #fff4;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:700}
#pause{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;background:#0a0e16ee}
#pause h2{margin:0 0 2px;font-size:26px;color:#ff7a2f}
#psala{font-size:14px;opacity:.8;margin-bottom:6px}
#pause button{width:min(320px,100%);padding:12px;font-size:16px;font-weight:700;color:#fff;background:#2f6bff;border:0;border-radius:10px}
#pause button.out{background:#d63a3a}
#pause small{opacity:.6;font-size:12px;text-align:center}
/* armas */
#wpns{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:5px;z-index:6}
.wbtn{width:42px;height:40px;border-radius:8px;background:#0008;border:2px solid #fff4;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:700;line-height:1.15}
.wbtn b{font-size:14px}
.wbtn.on{background:#ff7a2fcc;border-color:#fff}
#bZoom{display:none;right:192px;bottom:62px;width:56px;height:56px;background:#8a4bff99}
#scope{display:none;z-index:4;inset:0;background:linear-gradient(#000,#000) center/100% 1px no-repeat,linear-gradient(#000,#000) center/1px 100% no-repeat,radial-gradient(circle at center,#0000 0,#0000 38vmin,#000 38.5vmin)}
@media (max-width:640px){.wbtn{width:34px}#wpns{gap:4px}}
@media (orientation:portrait){#wpns{bottom:172px}#bZoom{right:24px;bottom:172px}}
</style></head><body>
<div id="menu">
  <h1>FPS MOBILE</h1>
  <input id="name" maxlength="14" placeholder="Seu nome">
  <select id="mode"><option value="ffa">Cada um por si</option><option value="team">Equipes (vermelho x azul)</option></select>
  <select id="max"><option>2</option><option>4</option><option selected>6</option><option>8</option></select>
  <button id="bCreate">Criar sala</button>
  <input id="code" maxlength="5" placeholder="Código da sala" style="text-transform:uppercase">
  <button id="bJoin" class="alt">Entrar em sala</button>
  <div id="msg"></div>
</div>
<div class="hud" id="hp"></div><div class="hud" id="ammo"></div><div class="hud" id="cross"></div>
<div class="hud" id="board"></div><div class="hud" id="feed"></div><div class="hud" id="info"></div><div class="hud" id="red"></div>
<div id="joy"><div id="knob"></div></div>
<div class="btn" id="bFire">ATIRAR</div><div class="btn" id="bJump">PULAR</div><div class="btn" id="bRel">RECARR.</div>
<div class="hud" id="scope"></div>
<div class="btn ui" id="bZoom">MIRA</div>
<div class="ui" id="wpns"></div>
<div class="ui" id="pbtn">☰ Menu</div>
<div class="ui" id="pause">
  <h2>Menu</h2>
  <div id="psala"></div>
  <button id="bResume">Continuar</button>
  <button id="bLeave" class="out">Sair da partida</button>
  <small>A partida continua para os outros jogadores.</small>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const $ = id => document.getElementById(id);
const sock = io();
$('name').value = localStorage.nome || '';
const qs = new URLSearchParams(location.search); if (qs.get('sala')) $('code').value = qs.get('sala');

let inRoom = false, roomCode = '', myId = '', boxes = [], myTeam = -1, mode = 'ffa';
let hp = 100, dead = false, ammo = 12, reloading = false, lastShot = 0, snap = [];
const P = { x: 0, y: 0, z: 0, vy: 0, yaw: 0, pitch: 0 };
let jx = 0, jy = 0, firing = false;
let paused = false, cur = 0, zoomed = false, reloadT = 0;

// ---------- Cena ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'low-power' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight); document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x87b7e0); scene.fog = new THREE.Fog(0x87b7e0, 20, 70);
const cam = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 100); cam.rotation.order = 'YXZ';
scene.add(new THREE.HemisphereLight(0xffffff, 0x556655, 1));
const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(10, 20, 5); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshLambertMaterial({ color: 0x4d7a45 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });
// arma na mão
const gun = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.5), new THREE.MeshLambertMaterial({ color: 0x222222 }));
gun.position.set(0.25, -0.22, -0.5); cam.add(gun); scene.add(cam);

// ---------- Armas ----------
// rate = ms entre tiros • mag = pente • reload = ms • pellets = projéteis por tiro • spread = dispersão (rad) • kick = coice do modelo
const WEAPONS = [
  { name: 'Pistola',  tag: 'PIST', mag: 12, rate: 160,  reload: 1200, pellets: 1, spread: 0,    kick: .08, snd: [120, .08] }, // arma original
  { name: 'Fuzil',    tag: 'FUZ',  mag: 30, rate: 110,  reload: 1800, pellets: 1, spread: .008, kick: .06, snd: [150, .05] },
  { name: 'SMG',      tag: 'SMG',  mag: 25, rate: 75,   reload: 1500, pellets: 1, spread: .02,  kick: .04, snd: [190, .04] },
  { name: 'Escopeta', tag: 'ESC',  mag: 6,  rate: 750,  reload: 2200, pellets: 6, spread: .07,  kick: .16, snd: [70, .2] },
  { name: 'Sniper',   tag: 'SNP',  mag: 5,  rate: 1100, reload: 2600, pellets: 1, spread: 0,    kick: .2,  snd: [55, .25], zoom: 25 }
];
const mags = WEAPONS.map(w => w.mag);
const W = () => WEAPONS[cur];
const zk = () => cam.fov / 75; // sensibilidade menor com zoom
// modelos na mão: [largura, altura, comprimento, x, y, z, cor] — a pistola continua sendo a malha `gun` original
const MODELS = [
  null,
  [[.08, .10, .55, 0, 0, -.05, 0x2d3a2d], [.035, .035, .30, 0, .02, -.5, 0x111111], [.09, .08, .20, 0, -.005, -.28, 0x1c1c1c], [.07, .12, .14, 0, -.03, .27, 0x3b2f22], [.05, .17, .07, 0, -.13, 0, 0x151515], [.04, .05, .12, 0, .075, -.05, 0x111111]],
  [[.08, .11, .40, 0, 0, 0, 0x2b2b33], [.03, .03, .18, 0, .015, -.29, 0x111111], [.04, .22, .06, 0, -.15, .05, 0x111111], [.03, .05, .12, 0, 0, .26, 0x555555]],
  [[.05, .05, .70, 0, .02, -.28, 0x555a60], [.04, .04, .50, 0, -.03, -.2, 0x444444], [.08, .06, .20, 0, -.07, -.2, 0x6b4a2a], [.09, .11, .25, 0, 0, .12, 0x2a2a2a], [.07, .13, .14, 0, -.03, .27, 0x6b4a2a]],
  [[.07, .10, .62, 0, 0, -.02, 0x1d2a35], [.035, .035, .55, 0, .02, -.58, 0x111111], [.055, .055, .28, 0, .115, -.08, 0x0a0a0a], [.07, .07, .04, 0, .115, -.20, 0x222222], [.07, .07, .04, 0, .115, .04, 0x222222], [.06, .13, .14, 0, -.03, .27, 0x3b2f22], [.04, .08, .10, 0, -.09, .05, 0x111111]]
];
const models = MODELS.map(parts => {
  if (!parts) return null;
  const g = new THREE.Group();
  for (const p of parts) { const m = new THREE.Mesh(new THREE.BoxGeometry(p[0], p[1], p[2]), new THREE.MeshLambertMaterial({ color: p[6] })); m.position.set(p[3], p[4], p[5]); g.add(m); }
  g.visible = false; gun.add(g); return g;
});
function applyModel() { gun.material.visible = cur === 0; models.forEach((g, i) => { if (g) g.visible = i === cur; }); }

function buildMap() {
  boxes.forEach((b, i) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(b[3], b[4], b[5]), new THREE.MeshLambertMaterial({ color: b[4] > 3 ? 0x8a7f72 : 0xa0733c }));
    m.position.set(b[0], b[1], b[2]); scene.add(m);
  });
}
const others = {};
const teamCol = t => t === 0 ? 0xe03030 : t === 1 ? 0x3060e0 : 0xe08a30;
function getOther(p) {
  if (!others[p.id]) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.2, 0.4), new THREE.MeshLambertMaterial({ color: teamCol(p.t) })); body.position.y = 0.7;
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), new THREE.MeshLambertMaterial({ color: 0xf0c8a0 })); head.position.y = 1.55;
    g.add(body, head); g.userData.tx = p.x; g.userData.tz = p.z; scene.add(g); others[p.id] = g;
  }
  return others[p.id];
}

// ---------- Rede ----------
function start(r) {
  if (!r.ok) { $('msg').textContent = r.msg || 'Erro'; return; }
  const first = !inRoom;
  inRoom = true; roomCode = r.code; myId = r.id; boxes = r.boxes; myTeam = r.team; mode = r.mode;
  P.x = r.x; P.z = r.z; P.y = 0; hp = 100; dead = false;
  if (first) buildMap();
  $('menu').style.display = 'none';
  $('info').textContent = `Sala ${r.code} • toque p/ copiar convite`;
  localStorage.nome = $('name').value;
}
$('bCreate').onclick = () => sock.emit('create', { name: $('name').value, mode: $('mode').value, max: $('max').value }, start);
$('bJoin').onclick = () => sock.emit('join', { name: $('name').value, code: $('code').value }, start);
$('info').style.pointerEvents = 'auto';
$('info').onclick = () => { const l = `${location.origin}/?sala=${roomCode}`; (navigator.share ? navigator.share({ title: 'FPS', text: 'Entra na minha sala!', url: l }) : navigator.clipboard.writeText(l)).catch(() => { }); };
// reconexão: reentra na sala automaticamente
sock.on('connect', () => { if (inRoom) sock.emit('join', { name: $('name').value, code: roomCode }, r => { if (r.ok) { myId = r.id; P.x = r.x; P.z = r.z; } else location.reload(); }); });
sock.on('snap', s => {
  snap = s; const ids = {};
  for (const p of s) {
    ids[p.id] = 1;
    if (p.id === myId) { hp = p.hp; continue; }
    const g = getOther(p); g.userData.tx = p.x; g.userData.ty = p.y; g.userData.tz = p.z; g.rotation.y = p.r; g.visible = p.hp > 0;
  }
  for (const id in others) if (!ids[id]) { scene.remove(others[id]); delete others[id]; }
  const me = s.find(p => p.id === myId);
  const list = [...s].sort((a, b) => b.k - a.k).map(p => `<div style="color:#${teamCol(p.t).toString(16).padStart(6, '0')}">${p.n}${p.id === myId ? ' (você)' : ''} ${p.k}/${p.d}</div>`).join('');
  $('board').innerHTML = '<b>Placar (K/M)</b>' + list;
  $('hp').textContent = '❤ ' + Math.max(0, hp);
});
sock.on('shot', s => {
  const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...s.o), new THREE.Vector3(...s.e)]), new THREE.LineBasicMaterial({ color: 0xffee88 }));
  scene.add(l); setTimeout(() => scene.remove(l), 60); if (s.id !== myId) beep(300, .05);
});
sock.on('hurt', h => { $('red').style.opacity = .5; setTimeout(() => $('red').style.opacity = 0, 150); if (h <= 0) { dead = true; $('hp').textContent = '☠ Respawn em 3s'; } });
sock.on('hitmark', () => { $('cross').style.borderColor = '#f33'; setTimeout(() => $('cross').style.borderColor = '#fff8', 100); beep(900, .04); });
sock.on('respawn', r => { P.x = r.x; P.z = r.z; P.y = 0; P.vy = 0; dead = false; refillAll(); });
sock.on('feed', t => { const d = document.createElement('div'); d.textContent = t; $('feed').appendChild(d); setTimeout(() => d.remove(), 4000); });

// ---------- Som ----------
let ac; function beep(f, d) { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), g = ac.createGain(); o.type = 'square'; o.frequency.value = f; g.gain.value = .08; o.connect(g); g.connect(ac.destination); o.start(); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d); o.stop(ac.currentTime + d); } catch (e) { } }

// ---------- Controles ----------
const joy = $('joy'), knob = $('knob'); let joyId = null, lookId = null, lx = 0, ly = 0;
function joyMove(t) { const r = joy.getBoundingClientRect(); let dx = t.clientX - (r.left + 65), dy = t.clientY - (r.top + 65); const m = Math.hypot(dx, dy), max = 55; if (m > max) { dx *= max / m; dy *= max / m; } knob.style.transform = `translate(${dx}px,${dy}px)`; jx = dx / max; jy = dy / max; }
joy.addEventListener('touchstart', e => { e.preventDefault(); joyId = e.changedTouches[0].identifier; joyMove(e.changedTouches[0]); }, { passive: false });
document.addEventListener('touchstart', e => { for (const t of e.changedTouches) { if (t.target.closest('#menu,.btn,#joy,#info,.ui')) continue; if (lookId === null && t.clientX > innerWidth / 2) { lookId = t.identifier; lx = t.clientX; ly = t.clientY; } } }, { passive: false });
document.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joyId) joyMove(t);
    if (t.identifier === lookId) { P.yaw -= (t.clientX - lx) * 0.006 * zk(); P.pitch = Math.max(-1.4, Math.min(1.4, P.pitch - (t.clientY - ly) * 0.006 * zk())); lx = t.clientX; ly = t.clientY; }
  }
}, { passive: false });
document.addEventListener('touchend', e => { for (const t of e.changedTouches) { if (t.identifier === joyId) { joyId = null; jx = jy = 0; knob.style.transform = ''; } if (t.identifier === lookId) lookId = null; } });
const hold = (id, on, off) => { const el = $(id); el.addEventListener('touchstart', e => { e.preventDefault(); on(); }, { passive: false }); el.addEventListener('touchend', e => { e.preventDefault(); off && off(); }); };
hold('bFire', () => firing = true, () => firing = false);
hold('bJump', () => { if (P.y <= groundH() + .01) P.vy = 7; });
hold('bRel', reload);
// teclado/mouse para testar no PC
const keys = {}; addEventListener('keydown', e => { keys[e.code] = 1; if (e.code === 'Space' && P.y <= groundH() + .01) P.vy = 7; if (e.code === 'KeyR') reload(); });
addEventListener('keyup', e => keys[e.code] = 0);
addEventListener('mousedown', () => { if (inRoom) firing = true; }); addEventListener('mouseup', () => firing = false);
addEventListener('mousemove', e => { if (e.buttons & 2) { P.yaw -= e.movementX * .004 * zk(); P.pitch = Math.max(-1.4, Math.min(1.4, P.pitch - e.movementY * .004 * zk())); } });

// ---------- Troca de armas, mira e menu de pausa ----------
const tap = (el, fn) => { // toque (instantâneo) + clique (PC), sem disparo duplo
  let t = -1e3;
  const go = e => { e.preventDefault(); e.stopPropagation(); const n = performance.now(); if (e.type === 'click' && n - t < 400) return; t = n; fn(); };
  el.addEventListener('touchstart', go, { passive: false }); el.addEventListener('click', go);
  el.addEventListener('mousedown', e => e.stopPropagation());
};
const wb = WEAPONS.map((w, i) => { const b = document.createElement('div'); b.className = 'wbtn'; b.innerHTML = `<b>${i + 1}</b>${w.tag}`; $('wpns').appendChild(b); tap(b, () => selectWeapon(i)); return b; });
function refillAll() { WEAPONS.forEach((w, i) => mags[i] = w.mag); clearTimeout(reloadT); reloading = false; ammo = mags[cur]; updAmmo(); }
function setZoom(on) { if (on && !W().zoom) return; zoomed = on; $('scope').style.display = on ? 'block' : 'none'; $('cross').style.visibility = on ? 'hidden' : ''; gun.visible = !on; }
function selectWeapon(i) {
  i = (i + WEAPONS.length) % WEAPONS.length; if (paused || i === cur) return;
  mags[cur] = ammo; clearTimeout(reloadT); reloading = false; setZoom(false);
  cur = i; ammo = mags[cur]; applyModel();
  lastShot = performance.now() - W().rate + Math.min(W().rate, 250);
  wb.forEach((b, k) => b.classList.toggle('on', k === cur));
  $('bZoom').style.display = W().zoom ? 'flex' : 'none';
  updAmmo(); beep(500, .03);
}
tap($('bZoom'), () => { if (!paused) setZoom(!zoomed); });
function setPause(on) {
  if (on && !inRoom) return;
  paused = on; $('pause').style.display = on ? 'flex' : 'none';
  if (on) { firing = false; $('psala').textContent = 'Sala ' + roomCode; }
}
function leaveMatch() { try { sock.disconnect(); } catch (e) { } location.replace(location.pathname); }
tap($('pbtn'), () => setPause(true));
tap($('bResume'), () => setPause(false));
tap($('bLeave'), leaveMatch);
$('pause').addEventListener('mousedown', e => e.stopPropagation());
addEventListener('keydown', e => {
  if (e.code === 'Escape') { setPause(!paused); return; }
  if (!inRoom || paused) return;
  const m = /^Digit(\d)$/.exec(e.code); if (m && +m[1] >= 1 && +m[1] <= WEAPONS.length) selectWeapon(+m[1] - 1);
  if (e.code === 'KeyQ') selectWeapon(cur + 1);
  if (e.code === 'KeyZ') setZoom(!zoomed);
});

function updAmmo() { const w = W(); $('ammo').textContent = reloading ? 'Recarregando...' : `🔫 ${w.name} ${ammo}/${w.mag}`; }
function reload() { const w = W(); if (reloading || paused || ammo === w.mag) return; reloading = true; updAmmo(); reloadT = setTimeout(() => { ammo = w.mag; reloading = false; updAmmo(); }, w.reload); }
function shoot() {
  const n = performance.now(), w = W(); if (dead || paused || reloading || n - lastShot < w.rate) return; lastShot = n;
  if (ammo <= 0) { reload(); return; }
  ammo--; updAmmo(); beep(...w.snd); gun.position.z = -0.5 + w.kick;
  for (let i = 0; i < w.pellets; i++) sock.emit('shoot', { x: P.x, y: P.y, z: P.z, yaw: P.yaw + (Math.random() - .5) * 2 * w.spread, pitch: P.pitch + (Math.random() - .5) * 2 * w.spread, w: cur });
}

// ---------- Física ----------
const R = 0.4;
function groundH() { let g = 0; for (const b of boxes) { const top = b[1] + b[4] / 2; if (Math.abs(P.x - b[0]) < b[3] / 2 + R * .5 && Math.abs(P.z - b[2]) < b[5] / 2 + R * .5 && P.y >= top - 0.35) g = Math.max(g, top); } return g; }
function collide() {
  for (const b of boxes) {
    const top = b[1] + b[4] / 2; if (P.y >= top - 0.35) continue;
    const hx = b[3] / 2 + R, hz = b[5] / 2 + R, dx = P.x - b[0], dz = P.z - b[2];
    if (Math.abs(dx) < hx && Math.abs(dz) < hz) { if (hx - Math.abs(dx) < hz - Math.abs(dz)) P.x = b[0] + Math.sign(dx || 1) * hx; else P.z = b[2] + Math.sign(dz || 1) * hz; }
  }
}
let last = performance.now(), sendT = 0;
function loop(now) {
  requestAnimationFrame(loop); const dt = Math.min((now - last) / 1000, .05); last = now;
  if (inRoom && !dead) {
    let ax = paused ? 0 : jx, ay = paused ? 0 : jy; if (!paused) { if (keys.KeyA) ax -= 1; if (keys.KeyD) ax += 1; if (keys.KeyW) ay -= 1; if (keys.KeyS) ay += 1; }
    const s = 6 * dt, c = Math.cos(P.yaw), sn = Math.sin(P.yaw);
